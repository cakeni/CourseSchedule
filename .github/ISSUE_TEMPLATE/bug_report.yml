name: Bug 报告
description: 报告可稳定复现的应用问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除截图或样例文件中的姓名、学号和真实课程信息。

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.0.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Xiaomi 14 / Android 15
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 按顺序列出从打开应用到问题出现的操作
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 课表显示或滑动
        - 课程编辑
        - Excel 或文本导入
        - 学期与设置
        - 课程提醒
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或脱敏截图
      description: 可选。不要上传真实课表或其他人的个人信息。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除姓名、学号、课程表和设备标识等敏感信息。
          required: true
