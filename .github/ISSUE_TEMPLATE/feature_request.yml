name: 功能建议
description: 描述一个明确的使用场景和期望行为
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前在什么情况下遇到困难？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户可见的交互和结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - 课表显示或滑动
        - 课程编辑
        - 导入与备份
        - 学期与设置
        - 课程提醒
        - 其他
    validations:
      required: true
